# ============================================
# SSH APPLICATION CONFIGURATION
# ============================================

spring.application.name=Shared Services Hub-backend
server.port=8080

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ssh
spring.datasource.username=ssh_user
spring.datasource.password=ssh_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

# TODO: Change to 'validate' when Liquibase migrations are complete
spring.jpa.hibernate.ddl-auto=update

# TODO: Set to false in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# LIQUIBASE MIGRATION
# ============================================

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ============================================
# REDIS CONFIGURATION
# ============================================

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
# ============================================
# JWT SECURITY
# ============================================

# TODO: Move secret to environment variable in production
jwt.secret=${JWT_SECRET:sshSuperSecretKeyForDevOnly123456789}
jwt.expiration=86400000

# ============================================
# LOGGING
# ============================================

logging.level.com.ssh=DEBUG
logging.level.org.springframework=INFO

# ============================================
# SWAGGER / OPENAPI
# ============================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
