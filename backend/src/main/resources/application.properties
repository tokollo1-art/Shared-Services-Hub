# ============================================
# SSH APPLICATION CONFIGURATION
# ============================================

spring.application.name=Shared Services Hub-backend
server.port=8080

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ssh}
spring.datasource.username=${DB_USERNAME:ssh_user}
spring.datasource.password=${DB_PASSWORD:ssh_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

# TODO: Change to 'validate' when Liquibase migrations are complete
spring.jpa.hibernate.ddl-auto=update

# TODO: Set to false in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# LIQUIBASE MIGRATION
# ============================================

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ============================================
# REDIS CONFIGURATION
# ============================================

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ============================================
# JWT SECURITY
# ============================================

jwt.secret=${JWT_SECRET:sshSuperSecretKeyForDevOnly123456789}
jwt.expiration=86400000

# ============================================
# AGENT USER (seeded on startup)
# ============================================

agent.email=${AGENT_EMAIL:agent@ssh.local}
agent.password=${AGENT_PASSWORD:agent-dev-password}

# ============================================
# LOGGING
# ============================================

logging.level.com.ssh=DEBUG
logging.level.org.springframework=INFO

# ============================================
# SWAGGER / OPENAPI
# ============================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# ACTUATOR (health probes for container healthcheck)
# ============================================

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================
# AI SERVICE (webhook target)
# ============================================

ssh.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
ssh.ai-service.webhook-token=${WEBHOOK_TOKEN:dev-webhook-token-change-me}
ssh.ai-service.enabled=${AI_SERVICE_ENABLED:true}
